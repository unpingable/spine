# Spine Packet S-B — the public-mvp specimen corpus (roadmaps + campaigns).
#
# A hand-declared manifest over agent_gov's real planning surfaces: the four
# roadmap hub files, the 18 per-tool roadmaps, and every campaign's CAMPAIGN.md
# and STATUS.md that exists. Each file is enumerated by name because the
# adapter cannot crawl — "Spine never implies scope" is the charter, not a
# limitation. Cross-repo references (repo: agent_gov from the spine repo) are
# navigationally legal per the OQ-2 ruling (2026-07-16): Spine indexes a
# sibling it does not vendor; location is a coordinate, never custody.
#
# Status policy (OQ-2 ruling, applied):
#   * QUOTE WHERE QUOTABLE — where a doc carries a literal Status declaration,
#     its first paragraph is preserved VERBATIM in status_quote beside the
#     normalized reported_status, so normalization can never quietly launder
#     the quotation into an assertion.
#   * Normalization is downgrade-only, never toward authority:
#       - "RATIFIED ..."          -> ratified  (6 docs; each carries a witness_ref
#         to the executed-A8 / Q-A7 record in the 2026-07-02 roadmap-program
#         handoff — a governed claim without a witness would be refused)
#       - "DRAFT ..." / "CANDIDATE ..." -> candidate (a draft awaiting
#         ratification is this estate's candidate)
#       - quotable but unmapped ("LIVE HUB", "NORMATIVE", "ACTIVE",
#         "FILED ...") -> unknown + the verbatim quote: the sign says
#         something, but not in the closed vocabulary. Spine shows the words
#         and declines the normalization. NORMATIVE in particular is NOT
#         promoted to ratified — no witness was declared, and importance is
#         not authority.
#   * NO QUOTABLE STATUS -> unknown, sourceless. Absence of a declaration is
#     not a declaration of absence. (Campaign STATUS.md titles are titles.)
#
# Edition timestamp: fixed at 2026-07-16T00:00:00Z per the OQ-3 ruling — an
# identity coordinate chosen for stranger-reproducibility, not a claim about
# when bytes were generated.

